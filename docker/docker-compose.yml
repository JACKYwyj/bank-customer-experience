version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: bank-customer-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bank_customer
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: bank-customer-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Kafka Message Queue
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: bank-customer-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: bank-customer-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFBA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Service Flow Engine
  service-flow:
    build:
      context: ..
      dockerfile: docker/Dockerfile.service-flow
    container_name: bank-customer-service-flow
    ports:
      - "8004:8004"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/bank_customer
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      DEBUG: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    command: uvicorn src.service-flow.service:app --host 0.0.0.0 --port 8004 --reload

  # Journey Orchestrator
  journey-orchestrator:
    build:
      context: ..
      dockerfile: docker/Dockerfile.journey-orchestrator
    container_name: bank-customer-journey-orchestrator
    ports:
      - "8003:8003"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/bank_customer
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      DEBUG: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    command: uvicorn src.journey-orchestrator.service:app --host 0.0.0.0 --port 8003 --reload

  # Space Optimizer
  space-optimizer:
    build:
      context: ..
      dockerfile: docker/Dockerfile.space-optimizer
    container_name: bank-customer-space-optimizer
    ports:
      - "8005:8005"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/bank_customer
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      DEBUG: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn src.space-optimizer.service:app --host 0.0.0.0 --port 8005 --reload

  # Emotion Recognition Service
  emotion-recognition:
    build:
      context: ..
      dockerfile: docker/Dockerfile.emotion-recognition
    container_name: bank-customer-emotion-recognition
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/bank_customer
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      DEBUG: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn src.emotion-recognition.service:app --host 0.0.0.0 --port 8001 --reload

  # Empathy AI Service
  empathy-ai:
    build:
      context: ..
      dockerfile: docker/Dockerfile.empathy-ai
    container_name: bank-customer-empathy-ai
    ports:
      - "8002:8002"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/bank_customer
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      DEBUG: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn src.empathy-ai.service:app --host 0.0.0.0 --port 8002 --reload

  # Privacy Shield Service
  privacy-shield:
    build:
      context: ..
      dockerfile: docker/Dockerfile.privacy-shield
    container_name: bank-customer-privacy-shield
    ports:
      - "8006:8006"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/bank_customer
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      DEBUG: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn src.privacy-shield.service:app --host 0.0.0.0 --port 8006 --reload

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: bank-customer-network
